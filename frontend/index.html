<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRA — Bandeja de Revisión Asistida (F1)</title>
  <meta name="description" content="Plataforma de Inteligencia Multimodal para Decisiones Empresariales - Bandeja Asistida F1 y Motor F4">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  <!-- Header Persistente MIRA -->
  <header class="glass-header text-white px-6 py-3.5 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-400 flex items-center justify-center font-display font-extrabold text-xl text-white shadow-lg">
          M
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-display font-black text-xl tracking-tight text-white">MIRA</span>
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-indigo-900/80 text-indigo-300 border border-indigo-700/60">
              F1 Asistida
            </span>
          </div>
          <p class="text-[11px] text-slate-400">Inteligencia Multimodal para Reembolsos de Salud</p>
        </div>
      </div>

      <!-- Selector de Rol y Tenant -->
      <div class="flex items-center space-x-4">
        <div class="hidden sm:flex items-center space-x-2 bg-slate-800/80 border border-slate-700/80 px-3 py-1.5 rounded-lg text-xs">
          <span class="text-slate-400">Organización:</span>
          <span class="font-semibold text-slate-200" id="current-tenant-badge">Aseguradora Piloto</span>
        </div>
        
        <div class="flex items-center space-x-2 bg-slate-800/80 border border-slate-700/80 px-3 py-1.5 rounded-lg text-xs">
          <span class="text-slate-400">Rol Activo:</span>
          <select id="role-selector" class="bg-transparent text-indigo-300 font-semibold focus:outline-none cursor-pointer">
            <option value="operador_marco" class="bg-slate-900 text-white">Operador (Marco Peñailillo)</option>
            <option value="medico_andrea" class="bg-slate-900 text-white">Revisora Médica (Dra. Andrea Muñoz)</option>
            <option value="supervisor_rodrigo" class="bg-slate-900 text-white">Supervisor (Rodrigo Valenzuela)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenedor Dinámico Principal (SPA) -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- El contenido de la bandeja o del detalle de caso se monta dinámicamente aquí -->
    <div class="flex items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>
  </main>

  <!-- Pie de Página Institucional -->
  <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-4 px-6 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Motor F4 v1.0.0-f4 • Cumplimiento DEC-01 a DEC-10 • RNF-01 a RNF-10</span>
      </div>
      <div>
        DPRIME SpA / Aseguradora Piloto — Proyecto MIRA
      </div>
    </div>
  </footer>

  <!-- Modal Global de Discrepancia / Confirmación -->
  <div id="modal-container" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4"></div>

  <!-- Script Principal de la Aplicación -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
